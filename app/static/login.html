<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CT Image Analyzer</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h1>CT Image Analyzer</h1>
            <p class="subtitle">AI-Powered Medical Image Analysis</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>

            <div id="error-message" class="error-message hidden"></div>

            <p class="auth-link">Don't have an account? <a href="/register">Register here</a></p>

            <div class="disclaimer">
                <strong>Disclaimer:</strong> This tool is for educational/research purposes only.
                It should NOT be used for actual medical diagnosis.
            </div>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
    <script>
        if (getToken()) {
            window.location.href = '/';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error-message');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            errorEl.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';

            try {
                const success = await login(username, password);
                if (success) {
                    window.location.href = '/';
                } else {
                    errorEl.textContent = 'Invalid username or password';
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorEl.textContent = 'Login failed: ' + err.message;
                errorEl.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
