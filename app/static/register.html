<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CT Image Analyzer</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h1>CT Image Analyzer</h1>
            <p class="subtitle">Create an Account</p>

            <form id="register-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username" minlength="3">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password" minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password" minlength="6">
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
            </form>

            <div id="error-message" class="error-message hidden"></div>
            <div id="success-message" class="success-message hidden"></div>

            <p class="auth-link">Already have an account? <a href="/login">Login here</a></p>

            <div class="disclaimer">
                <strong>Disclaimer:</strong> This tool is for educational/research purposes only.
                It should NOT be used for actual medical diagnosis.
            </div>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
    <script>
        if (getToken()) {
            window.location.href = '/';
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorEl = document.getElementById('error-message');
            const successEl = document.getElementById('success-message');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            errorEl.classList.add('hidden');
            successEl.classList.add('hidden');

            if (password !== confirmPassword) {
                errorEl.textContent = 'Passwords do not match';
                errorEl.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Registering...';

            try {
                const result = await register(username, password);
                if (result.success) {
                    successEl.textContent = 'Account created! Redirecting to login...';
                    successEl.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    errorEl.textContent = result.error;
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorEl.textContent = 'Registration failed: ' + err.message;
                errorEl.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register';
            }
        });
    </script>
</body>
</html>
