databases:
  - name: ct-analyzer-db
    plan: free
    databaseName: ct_analyzer
    user: ct_analyzer

services:
  - type: web
    name: ct-image-analyzer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ct-analyzer-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
